# Fly.io 配置。在仓库根目录执行：
#   fly launch --no-deploy        # 首次，app 名字改成全局唯一的
#   fly secrets set DEEPSEEK_API_KEY=sk-...
#   fly deploy
app = "shuangxiu-app"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
