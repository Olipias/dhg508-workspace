services:
  - type: web
    name: qianling-sim
    runtime: python
    plan: free
    buildCommand: "python3 -m py_compile server/npc_server.py server/web_server.py"
    startCommand: python3 server/web_server.py --host 0.0.0.0
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
